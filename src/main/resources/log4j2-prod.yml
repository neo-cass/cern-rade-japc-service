Configuration:
  #set the configuration logging level to info
  status: info
  properties:
    property:
      #pattern for file and console logging
      - name: pattern
        value: "%white{%date{ISO8601}} %highlight{%-5level} [Thread: %yellow{%thread}] [Class: %green{%logger{1}}]: %message%n%red{%exception{full}}"
      - name: app_name
        value: ${spring:spring.application.name}

  Appenders:
    Console:
      target: SYSTEM_OUT
      name: console
      PatternLayout:
        pattern: ${pattern}
    RollingFile:
      name: file
      PatternLayout:
        pattern: ${pattern}
      filePattern: "logs/archive-%d{yyyy-MM}/%d{yyyy-MM-dd}-%i.log.gz"
      fileName: "logs/${app_name}.log"
      policies:
        TimeBasedTriggeringPolicy:
          interval: 1
          modulate: false
        SizeBasedTriggeringPolicy:
          size: 1GB
      DefaultRolloverStrategy:
        max: 20
    # OTLP to MONIT OpenSearch when the monit profile enables export; context data (request log fields) become attributes
    OpenTelemetry:
      name: monit
      captureContextDataAttributes: "*"

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: console
        - ref: file
        - ref: monit
