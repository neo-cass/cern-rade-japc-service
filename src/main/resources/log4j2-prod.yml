Configuration:
  status: warn
  properties:

    property:
      - name: pattern
        value: "%white{%date{ISO8601}} %highlight{%-5level} [Thread: %yellow{%thread}] [Class: %green{%class{1}}]: %message%n%red{%exception{full}}"
      - name: log_file
        value: logs/${spring:spring.application.name}.log
  Appenders:
    Console:
      target: SYSTEM_OUT
      name: console
      PatternLayout:
        pattern: ${pattern}
    File:
      name: file
      PatternLayout:
        pattern: ${pattern}
      fileName: ${log_file}
    Socket:
      name: logstash
      host: cs-ccr-rade4.cern.ch
      port: 30000
      protocol: udp
      GelfLayout:
        host: rade-services-japc
        compressionType: "OFF"
        includeNullDelimiter: false
        messagePattern: ${pattern}

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: console
        - ref: file
        - ref: logstash
