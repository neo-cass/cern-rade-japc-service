spring:
  application:
    name: "rade-services-japc"
  profiles:
    active: prod
  web:
    resources:
      add-mappings: false

springdoc:
  paths-to-exclude: /**
  swagger-ui:
    path: /docs/rest
    url: /openapi.yaml
    show-extensions: true
    show-common-extensions: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          additional-path: "server:/readyz"

logging:
  level:
    org.springframework.web.servlet.PageNotFound: ERROR

server:
  port: 8443
  mime-mappings:
    yaml: application/yaml
  ssl:
    enabled: false
  #tomcat:
    #relaxed-query-chars: "[,],{,},^,-"
