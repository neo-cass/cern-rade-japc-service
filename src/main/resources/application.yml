spring:
  application:
    name: "rade-services-japc"
  profiles:
    active: prod
  web:
    resources:
      add-mappings: false

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.web.servlet.PageNotFound: ERROR

server:
  port: 8443
  ssl:
    enabled: false
  #tomcat:
    #relaxed-query-chars: "[,],{,},^,-"
