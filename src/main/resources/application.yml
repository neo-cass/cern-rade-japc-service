spring:
  application:
    name: "rade-services-japc"
  profiles:
    active: prod
  web:
    resources:
      add-mappings: false

springdoc:
  paths-to-exclude: /**
  swagger-ui:
    path: /docs/rest
    url: /openapi.yaml
    show-extensions: true
    show-common-extensions: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  # OTLP export to MONIT only with the monit profile (application-monit.yml)
  otlp:
    metrics:
      export:
        enabled: false
        base-time-unit: seconds
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          additional-path: "server:/readyz"

logging:
  level:
    org.springframework.web.servlet.PageNotFound: ERROR

server:
  port: 8443
  # behind the OpenShift router: use its X-Forwarded-* headers for https redirects and client addresses
  forward-headers-strategy: framework
  servlet:
    session:
      persistent: false
  mime-mappings:
    yaml: application/yaml
  ssl:
    enabled: false
  #tomcat:
    #relaxed-query-chars: "[,],{,},^,-"
