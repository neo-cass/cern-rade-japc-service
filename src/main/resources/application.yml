spring:
  application:
    name: "rade-services-japc"
  profiles:
    active: prod
  mvc:
    static-path-pattern: /docs/**
  web:
    resources:
      static-locations: classpath:/docs/

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.web.servlet.PageNotFound: ERROR

server:
  port: 8443
  mime-mappings:
    yml: application/yaml
  ssl:
    enabled: false
  #tomcat:
    #relaxed-query-chars: "[,],{,},^,-"
