logging:
  level:
    com.netflix.config.sources.URLConfigurationSource: ERROR
    org.springframework.boot.autoconfigure: ERROR
    cern.cmw.directory.http.client.impl.feign.FeignDecoder: WARN
    cern.cmw.rda3.impl.transport.client.ClientDispatcher: WARN
    cern.cmw.rda3.impl.transport.zeromq.ZMQAdapter: WARN
    cern.cmw.rda3.impl.client.subscription.SubscriptionControllerImpl: WARN
  config: "classpath:log4j2-prod.yml"

service-properties:
  pingToClientFrequency: 5000
  waitTimeForNewValueFromSub: 1000
  firstUpdateTimeout: 5000
  socketIdleTimeout: 10000
  subQueueSize: 100
  rbac:
    required-role: "RADE-SERVICES-JAPC-USER"
    admin-role: "RADE-ADMIN"
    # Defaults are the RBAC maxima: token-lifetime 12h, session-lifetime 365d. session-idle-timeout defaults to 24h,
    # sessions-per-user to 20 (0 = unlimited).