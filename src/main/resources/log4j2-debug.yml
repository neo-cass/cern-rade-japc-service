Configuration:
  status: debug
  properties:
    property:
      - name: pattern
        value: "%white{%date{ISO8601}} %highlight{%-5level} [Thread: %yellow{%thread}] [Class: %green{%logger{1}}]: %message%n%red{%exception{full}}"
      - name: app_name
        value: ${spring:spring.application.name}
      - name: logstash_host
        value: ${spring:service-properties.logstashHost}
      - name: logstash_port
        value: ${spring:service-properties.logstashPort}

  Appenders:
    Console:
      target: SYSTEM_OUT
      name: console
      PatternLayout:
        pattern: ${pattern}
    RollingFile:
      name: file
      PatternLayout:
        pattern: ${pattern}
      filePattern: "logs/archive-%d{yyyy-MM}/%d{yyyy-MM-dd}-%i.log.gz"
      fileName: "logs/${app_name}.log"
      policies:
        TimeBasedTriggeringPolicy:
          interval: 1
          modulate: false
        SizeBasedTriggeringPolicy:
          size: 1GB
      DefaultRolloverStrategy:
        max: 20
    Socket:
      name: logstash
      host: ${logstash_host}
      port: ${logstash_port}
      protocol: udp
      JsonTemplateLayout:
        eventTemplateUri: "classpath:LogstashJsonEventLayoutV1.json"
        eventTemplateAdditionalField:
          - key: "app_name"
            value: "${app_name}"
            format: "STRING"

  Loggers:
    Root:
      level: debug
      AppenderRef:
        - ref: console
        - ref: file
        - ref: logstash
