#      host: localhost
#      port: 30000
#      protocol: udp
#      GelfLayout:
#        host: rade-services-japc
#        compressionType: OFF
#        includeNullDelimiter: true
#        messagePattern: *PATTERN

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: ConsoleAppender
