openapi: 3.1.0
info:
  title: RADE JAPC REST API
  version: v1
  description: |
    GET and SET of JAPC device parameters over HTTP.

    | Media type | Format |
    |---|---|
    | `application/json` | japc-json typed value (see `Value`). Default when `Accept` is absent or `*/*`. |
    | `application/labview-variant` | LabVIEW flattened data (see `LabVIEWData`), described by the `Lv-Type-Descriptor` header (see `LvTypeDescriptor`). |

    The response format is selected with `Accept`, the request body format with `Content-Type`.
    Errors use the same format as the request (see `Error`).

    Examples:
    ```
    curl -X PUT -D - -H 'Rbac: Explicit <base64url(username:password)>' 'https://<host>/rbac/session'
    curl -H 'Rbac: Cached <id>' 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition?selector=CPS.USER.ALL'
    curl -H 'Rbac: Cached <id>' 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition?fields=current,voltage'
    curl -H 'Rbac: Cached <id>' -X PUT -H 'Content-Type: application/json' -d '{"@type":"double_value","value":1.5}' 'https://<host>/api/v1/EXAMPLE.DEVICE/Setting/current'
    ```

    Every request needs an RBAC login (see the `Rbac` security scheme) whose token has the service's required RBAC role.
    Log in once with `PUT /rbac/session` (credentials or an RBAC token in the `Rbac` header). The service keeps that login as a cached RBAC session
    and answers with `Rbac: Cached <id>`. Send that header on every other call. Logging in on the other calls is rejected with 401.

    Subscriptions: [WebSocket API](/docs/websocket). Specifications: [/openapi.yaml](/openapi.yaml), [/asyncapi.yaml](/asyncapi.yaml).
security:
  - Rbac: []
servers:
  - url: /api/v1
    description: This deployment. /api is an alias of /api/v1.
tags:
  - name: RBAC session
    description: |
      Log in, inspect and log out of the caller's own cached RBAC session, at `/rbac/session` (not under `/api/v1`).
      Needs the service's required RBAC role or the admin RBAC role. This is the only place where credentials are accepted.
      Admins see the same cached RBAC sessions under `/admin/api/sessions`.
  - name: Parameter
    description: Access by device, property and optional field in the path.
  - name: LabVIEW descriptor
    description: Access by device in the path. Property and fields are taken from `Lv-Type-Descriptor`.
  - name: Admin
    description: |
      Admin API at `/admin/api`, used by the [admin panel](/admin). Needs the admin RBAC role, from the `Rbac` header
      or from the panel's CERN SSO login. JSON only.
paths:
  /{device}/{property}:
    parameters:
      - $ref: '#/components/parameters/device'
      - $ref: '#/components/parameters/property'
      - $ref: '#/components/parameters/selector'
    get:
      tags: [Parameter]
      operationId: getProperty
      summary: Get a property
      description: |
        ```
        curl -H 'Rbac: Cached <id>' 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition'
        curl -H 'Rbac: Cached <id>' -H 'Accept: application/labview-variant' -D - -o value.bin 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition'
        ```
      parameters:
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/LvTypeDescriptorOptional'
      responses:
        '200':
          $ref: '#/components/responses/Value'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags: [Parameter]
      operationId: setProperty
      summary: Set a property
      description: |
        ```
        curl -H 'Rbac: Cached <id>' -X PUT -H 'Content-Type: application/json' -d '{"@type":"map_value","current":{"@type":"double_value","value":1.5}}' 'https://<host>/api/v1/EXAMPLE.DEVICE/Setting'
        curl -H 'Rbac: Cached <id>' -X PUT -H 'Content-Type: application/labview-variant' -H 'Lv-Type-Descriptor: <descriptor>' --data-binary @value.bin 'https://<host>/api/v1/EXAMPLE.DEVICE/Setting'
        ```
      parameters:
        - $ref: '#/components/parameters/LvTypeDescriptorBody'
      requestBody:
        $ref: '#/components/requestBodies/PropertyValue'
      responses:
        '200':
          $ref: '#/components/responses/Set'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /{device}/{property}/{field}:
    parameters:
      - $ref: '#/components/parameters/device'
      - $ref: '#/components/parameters/property'
      - $ref: '#/components/parameters/field'
      - $ref: '#/components/parameters/selector'
    get:
      tags: [Parameter]
      operationId: getField
      summary: Get a field
      description: |
        ```
        curl -H 'Rbac: Cached <id>' 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition/current'
        ```
      parameters:
        - $ref: '#/components/parameters/LvTypeDescriptorOptional'
      responses:
        '200':
          $ref: '#/components/responses/Value'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags: [Parameter]
      operationId: setField
      summary: Set a field
      description: |
        ```
        curl -H 'Rbac: Cached <id>' -X PUT -H 'Content-Type: application/json' -d '{"@type":"double_value","value":1.5}' 'https://<host>/api/v1/EXAMPLE.DEVICE/Setting/current'
        ```
      parameters:
        - $ref: '#/components/parameters/LvTypeDescriptorBody'
      requestBody:
        $ref: '#/components/requestBodies/FieldValue'
      responses:
        '200':
          $ref: '#/components/responses/Set'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /{device}:
    parameters:
      - $ref: '#/components/parameters/device'
      - $ref: '#/components/parameters/selector'
      - $ref: '#/components/parameters/LvTypeDescriptorDevice'
    get:
      tags: [LabVIEW descriptor]
      operationId: getByDescriptor
      summary: Get the property named by the type descriptor
      description: |
        `404` without `Lv-Type-Descriptor`. `406` if `Accept` does not allow `application/labview-variant`.
        ```
        curl -H 'Rbac: Cached <id>' -H 'Accept: application/labview-variant' -H 'Lv-Type-Descriptor: <descriptor>' -o value.bin 'https://<host>/api/v1/EXAMPLE.DEVICE'
        ```
      responses:
        '200':
          description: Value encoded with the supplied descriptor.
          headers:
            Acq-Stamp:
              $ref: '#/components/headers/Acq-Stamp'
            Cycle-Stamp:
              $ref: '#/components/headers/Cycle-Stamp'
          content:
            application/labview-variant:
              schema:
                $ref: '#/components/schemas/LabVIEWData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags: [LabVIEW descriptor]
      operationId: setByDescriptor
      summary: Set the property named by the type descriptor
      description: |
        `404` without `Lv-Type-Descriptor`. `415` if `Content-Type` is not `application/labview-variant`.
        ```
        curl -H 'Rbac: Cached <id>' -X PUT -H 'Content-Type: application/labview-variant' -H 'Lv-Type-Descriptor: <descriptor>' --data-binary @value.bin 'https://<host>/api/v1/EXAMPLE.DEVICE'
        ```
      requestBody:
        required: true
        content:
          application/labview-variant:
            schema:
              $ref: '#/components/schemas/LabVIEWData'
      responses:
        '200':
          $ref: '#/components/responses/Set'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /session:
    servers:
      - url: /rbac
        description: Not under /api/v1.
    put:
      tags: [RBAC session]
      operationId: login
      summary: Log in
      description: |
        The only call that accepts login credentials: `Rbac: Explicit <base64url(username:password)>`,
        `Rbac: Kerberos <base64url(ticket)>`, `Rbac: Oauth <access token>` or `Rbac: Token <base64url(token)>`. The service keeps the login as a cached RBAC session.
        The cached id in the response is a secret, like a password: send it as
        `Rbac: Cached <id>` on every other call. The service renews the cached RBAC session, so the id keeps working until it
        is revoked, unused for 24 hours, or the service restarts. Admins can list and revoke it under `/admin/api/sessions`.
        A `Token` session cannot be renewed (RBAC only renews a token from the machine it was issued to): its cached id stops
        working when the token expires, and the client must log in again with a new token.

        With `Rbac: Cached <id>` the same id is returned again.
        PUT rather than POST because the LabVIEW client cannot send POST.
        ```
        curl -X PUT -D - -H 'Rbac: Explicit <base64url(username:password)>' 'https://<host>/rbac/session'
        ```
      responses:
        '204':
          description: Logged in. No body.
          headers:
            Rbac:
              $ref: '#/components/headers/Rbac'
            Cache-Control:
              description: '`no-store`, because of the secret id.'
              schema:
                type: string
                const: no-store
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    get:
      tags: [RBAC session]
      operationId: getSession
      summary: The caller's cached RBAC session
      description: |
        Works with `Rbac: Cached <id>`. The secret id is not returned.
        Admins see the same entry under `GET /admin/api/sessions`.
        ```
        curl -H 'Rbac: Cached <id>' 'https://<host>/rbac/session'
        ```
      responses:
        '200':
          description: The cached RBAC session the request was authenticated with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    delete:
      tags: [RBAC session]
      operationId: logout
      summary: Log out
      description: |
        Revokes the cached RBAC session whose cached id was sent, so the id gets 401 from then on. There is no parameter: a client can
        only revoke its own cached RBAC session. A login (`Explicit`, `Kerberos`, `Oauth`) is not accepted here.
        Admins can revoke any cached RBAC session under `/admin/api/sessions`, with the same effect.
        WebSocket subscriptions already open stay open; admins close them under `/admin/api/subscriptions`.
        ```
        curl -X DELETE -H 'Rbac: Cached <id>' 'https://<host>/rbac/session'
        ```
      responses:
        '204':
          description: Revoked. No body.
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /me:
    servers: &admin
      - url: /admin/api
    get:
      tags: [Admin]
      operationId: adminMe
      summary: The logged-in admin
      responses:
        '200':
          description: User, login type and RBAC roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMe'
        4XX:
          $ref: '#/components/responses/AdminError'
  /info:
    servers: *admin
    get:
      tags: [Admin]
      operationId: adminInfo
      summary: Version, uptime and RBAC settings
      responses:
        '200':
          description: Service information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceInfo'
        4XX:
          $ref: '#/components/responses/AdminError'
  /sessions:
    servers: *admin
    get:
      tags: [Admin]
      operationId: adminSessions
      summary: Cached RBAC sessions
      description: |
        All cached RBAC sessions of all users, the ones created by `PUT /rbac/session` and by CERN SSO logins to the admin panel.
        The panel's own login is therefore in the list.
        Each is identified by its public `handle`, not by its secret cached id.
      responses:
        '200':
          description: Cached RBAC sessions sorted by user, each user's most recently used first. The secret cached ids are not included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSession'
        4XX:
          $ref: '#/components/responses/AdminError'
    delete:
      tags: [Admin]
      operationId: adminRevokeAllSessions
      summary: Revoke all cached RBAC sessions
      description: Like `DELETE /rbac/session` for every cached RBAC session. Open subscriptions are not closed. Includes the panel's own login.
      responses:
        '204':
          description: Revoked. Their cached ids now get 401, so clients must log in again.
        4XX:
          $ref: '#/components/responses/AdminError'
  /users/{user}/sessions:
    servers: *admin
    delete:
      tags: [Admin]
      operationId: adminRevokeUserSessions
      summary: Revoke all cached RBAC sessions of one user
      description: Like `DELETE /rbac/session` for each of the user's cached RBAC sessions. Open subscriptions are not closed.
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked. Their cached ids now get 401, so all of the user's clients must log in again.
        4XX:
          $ref: '#/components/responses/AdminError'
  /sessions/{handle}:
    servers: *admin
    delete:
      tags: [Admin]
      operationId: adminRevokeSession
      summary: Revoke one cached RBAC session
      description: |
        Revokes a cached RBAC session created by `PUT /rbac/session` or by an admin panel SSO login. Its cached id then gets 401,
        just like after the client's own `DELETE /rbac/session`. Open subscriptions are not closed: use `/admin/api/subscriptions`.
        `handle` is from `GET /admin/api/sessions`.
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked. Its cached id now gets 401.
        4XX:
          $ref: '#/components/responses/AdminError'
  /subscriptions:
    servers: *admin
    get:
      tags: [Admin]
      operationId: adminSubscriptions
      summary: Open subscriptions
      responses:
        '200':
          description: Subscriptions, most recent first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSubscription'
        4XX:
          $ref: '#/components/responses/AdminError'
  /subscriptions/{id}:
    servers: *admin
    delete:
      tags: [Admin]
      operationId: adminCloseSubscription
      summary: Close a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Closed with WebSocket status 1000 "Closed by admin".
        4XX:
          $ref: '#/components/responses/AdminError'
  /clients:
    servers: *admin
    get:
      tags: [Admin]
      operationId: adminClients
      summary: Requests per user
      responses:
        '200':
          description: Requests per RBAC user since the service started, by user name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminClientRequests'
        4XX:
          $ref: '#/components/responses/AdminError'
components:
  securitySchemes:
    Rbac:
      type: apiKey
      in: header
      name: Rbac
      description: |
        RBAC credentials. Required: without them the service answers 401, and without the required RBAC role 403.

        A **cached RBAC session** is an RBAC login that this service holds and renews on the client's behalf. `PUT /rbac/session` creates one
        (so does an admin panel SSO login). The client refers to it with its secret cached id, `Rbac: Cached <id>`; admins refer to the
        same cached RBAC session with its public handle (`/admin/api/sessions`).

        | Value | Credentials | Accepted by |
        |---|---|---|
        | `Explicit <base64url(username:password)>` | Login with username and password. | `PUT /rbac/session` only |
        | `Kerberos <base64url(ticket)>` | Kerberos service ticket (GSS-API AP-REQ) for the RBAC server, `RBAC/rbac-pro-lb.cern.ch@CERN.CH` in PRO. Not a ticket for this service. | `PUT /rbac/session` only |
        | `Oauth <access token>` | CERN SSO access token whose audience is the RBAC server. Sent as-is, not Base64. The service logs in to RBAC with it and holds a renewable cached RBAC session, like Explicit and Kerberos. | `PUT /rbac/session` only |
        | `Token <base64url(token)>` | Serialized RBAC token the client obtained itself. Cached like the other logins, but never renewed: the cached RBAC session ends when the token expires. | `PUT /rbac/session` only |
        | `Cached <id>` | Id of the cached RBAC session, returned in the `Rbac` response header of `PUT /rbac/session`. | every call |

        A login scheme on any other call is rejected with 401. The service renews a cached RBAC session (except `Token`) for up to a year,
        so its cached id keeps working; a cached RBAC session unused for 24 hours is dropped, and so is the oldest one of a user above the
        per-user limit. Cached RBAC sessions are held in memory by the serving instance and are lost on restart.
      x-rbac-schemes: [Explicit, Kerberos, Oauth, Cached, Token]
  parameters:
    device:
      name: device
      in: path
      required: true
      description: Device name. Must not match `v[0-9]+`.
      schema:
        type: string
        not:
          pattern: '^v[0-9]+$'
      example: EXAMPLE.DEVICE
    property:
      name: property
      in: path
      required: true
      description: Property name.
      schema:
        type: string
      example: Acquisition
    field:
      name: field
      in: path
      required: true
      description: Field name.
      schema:
        type: string
      example: current
    selector:
      name: selector
      in: query
      required: false
      description: JAPC cycle selector, e.g. `CPS.USER.ALL`. Omit for non-multiplexed devices.
      schema:
        type: string
    fields:
      name: fields
      in: query
      required: false
      description: Comma-separated field names, e.g. `current,voltage`. The response contains only these fields. `400` if a field does not exist.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    LvTypeDescriptorOptional:
      name: Lv-Type-Descriptor
      in: header
      required: false
      description: |
        LabVIEW only. Descriptor to encode the response with (see `LvTypeDescriptor`).
        Must describe a cluster labelled with the property name or, for a field path, the field or a cluster labelled with the property containing only that field.
        When absent with `Accept: application/labview-variant`, the server derives the descriptor and returns it in the response.
      schema:
        $ref: '#/components/schemas/LvTypeDescriptor'
    LvTypeDescriptorBody:
      name: Lv-Type-Descriptor
      in: header
      required: false
      description: |
        Required when `Content-Type` is `application/labview-variant`. Describes the request body (see `LvTypeDescriptor`, including the marked types).
        Must describe the property or field of the path, as for the response descriptor, otherwise `400`. Enums and enum sets are decoded with the JAPC enum type of the parameter.
      schema:
        $ref: '#/components/schemas/LvTypeDescriptor'
    LvTypeDescriptorDevice:
      name: Lv-Type-Descriptor
      in: header
      required: true
      description: Cluster descriptor (see `LvTypeDescriptor`). The cluster label is the property name and the elements are the fields.
      schema:
        $ref: '#/components/schemas/LvTypeDescriptor'
  headers:
    Acq-Stamp:
      description: Acquisition stamp in nanoseconds since 1970-01-01T00:00:00Z.
      schema:
        type: integer
        format: int64
    Cycle-Stamp:
      description: Cycle stamp in nanoseconds since 1970-01-01T00:00:00Z. `0` when not multiplexed.
      schema:
        type: integer
        format: int64
    Rbac:
      description: '`Cached <id>`, the cached id of the cached RBAC session. Present when `PUT /rbac/session` logged in with credentials or a cached id. Send the value as the `Rbac` request header on every other call. The id is a secret, like a password.'
      schema:
        type: string
        pattern: '^Cached [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: Cached 3f2b8c1e-5d7a-4c2e-9b1f-0a6d4e8c2f71
    Lv-Type-Descriptor:
      description: LabVIEW only, when the request had no `Lv-Type-Descriptor`. Descriptor of the response body.
      schema:
        $ref: '#/components/schemas/LvTypeDescriptor'
  requestBodies:
    PropertyValue:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Value'
          example:
            '@type': map_value
            current:
              '@type': double_value
              value: 1.5
        application/labview-variant:
          schema:
            $ref: '#/components/schemas/LabVIEWData'
    FieldValue:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Value'
          example:
            '@type': double_value
            value: 1.5
        application/labview-variant:
          schema:
            $ref: '#/components/schemas/LabVIEWData'
  responses:
    Value:
      description: Parameter value.
      headers:
        Acq-Stamp:
          $ref: '#/components/headers/Acq-Stamp'
        Cycle-Stamp:
          $ref: '#/components/headers/Cycle-Stamp'
        Lv-Type-Descriptor:
          $ref: '#/components/headers/Lv-Type-Descriptor'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Value'
          examples:
            property:
              value:
                '@type': map_value
                current:
                  '@type': double_value
                  value: 1.5
                samples:
                  '@type': double_array_value
                  value: [1.0, 2.0]
            field:
              value:
                '@type': double_value
                value: 1.5
        application/labview-variant:
          schema:
            $ref: '#/components/schemas/LabVIEWData'
    Set:
      description: Value set. No body.
    AdminError:
      description: '401 without an RBAC login, 403 without the admin role, 404 for an unknown cached RBAC session (handle) or subscription.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: |
        Error in the negotiated format (see `Error`, `LabVIEWError`).

        `code` is the same in the JSON body and in the LabVIEW error cluster.

        | HTTP status | `code` | Cause |
        |---|---|---|
        | 400 | 5000 | Value or selector rejected by the device (invalid argument, invalid request, bad setting value) |
        | 400 | 5001 | Body or `Lv-Type-Descriptor` cannot be decoded. For example: data not matching the descriptor, a marked descriptor with the wrong layout (discrete function that is not a 2D Array of DBL, enum set that is not a Cluster of uniquely labelled Boolean), an enum item name the JAPC enum does not have, an unsigned value out of range, or an enum or enum set sent when the service cannot obtain the JAPC enum type of the parameter (the message names the field, e.g. `JAPC descriptor with enum type required for field mode`) |
        | 400 | 5003 | Malformed request, `Lv-Type-Descriptor` does not match the path, unknown field in `fields` |
        | 401 | 5002 | No `Rbac` header, invalid `Rbac` header, failed login, expired or invalid token, unknown, revoked or expired cached id (cached RBAC session), or a login scheme (`Explicit`, `Kerberos`, `Oauth`) on any call but `PUT /rbac/session` |
        | 403 | 5002 | Token lacks the service's required RBAC role (or, for `/rbac/session`, the admin role as well), or RBAC access to the device denied |
        | 404 | 5000 | Device or property not found |
        | 404 | 5003 | Unknown route |
        | 406 | 5003 | `Accept` not supported by the route |
        | 415 | 5003 | `Content-Type` not supported by the route |
        | 429 | 5005 | Rate limit of the RBAC user exceeded: requests per second (wait `Retry-After` seconds) or open subscriptions |
        | 500 | 5001 | Value cannot be encoded in the requested format, e.g. a JAPC type LabVIEW cannot represent |
        | 500 | 5004 | Internal error |
        | 502 | 5000 | Device or middleware error |
        | 504 | 5000 | Device timeout |
      headers:
        Retry-After:
          description: 429 only. Seconds to wait before retrying.
          schema:
            type: integer
        Lv-Type-Descriptor:
          description: LabVIEW only. Descriptor of the error cluster.
          schema:
            $ref: '#/components/schemas/LvTypeDescriptor'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/labview-variant:
          schema:
            $ref: '#/components/schemas/LabVIEWError'
      x-http-status-codes:
        '400': [5000, 5001, 5003]
        '401': [5002]
        '403': [5002]
        '404': [5000, 5003]
        '406': [5003]
        '415': [5003]
        '429': [5005]
        '500': [5001, 5004]
        '502': [5000]
        '504': [5000]
  schemas:
    Value:
      description: |
        japc-json typed value. `@type` identifies the JAPC value type.
        Enum, enum set and discrete function values use the japc-json 8.2.1 encoding. Their LabVIEW encoding is described in `LvTypeDescriptor`.
      oneOf:
        - $ref: '#/components/schemas/MapValue'
        - $ref: '#/components/schemas/ScalarValue'
        - $ref: '#/components/schemas/ArrayValue'
        - $ref: '#/components/schemas/Array2DValue'
    SimpleValue:
      oneOf:
        - $ref: '#/components/schemas/ScalarValue'
        - $ref: '#/components/schemas/ArrayValue'
        - $ref: '#/components/schemas/Array2DValue'
    MapValue:
      description: Property value. Each member other than `@type` is a field.
      type: object
      required: ['@type']
      properties:
        '@type':
          const: map_value
      additionalProperties:
        $ref: '#/components/schemas/SimpleValue'
      example:
        '@type': map_value
        current:
          '@type': double_value
          value: 1.5
    ScalarValue:
      type: object
      required: ['@type', value]
      properties:
        '@type':
          enum: [boolean_value, byte_value, short_value, int_value, long_value, float_value, double_value, string_value]
        value:
          type: [boolean, integer, number, string]
      example:
        '@type': double_value
        value: 1.5
    ArrayValue:
      type: object
      required: ['@type', value]
      properties:
        '@type':
          enum: [boolean_array_value, byte_array_value, short_array_value, int_array_value, long_array_value, float_array_value, double_array_value, string_array_value]
        value:
          type: array
          items:
            type: [boolean, integer, number, string]
      example:
        '@type': double_array_value
        value: [1.0, 2.0]
    Array2DValue:
      type: object
      required: ['@type', value, rowCount, columnCount]
      properties:
        '@type':
          enum: [boolean_array_2d_value, byte_array_2d_value, short_array_2d_value, int_array_2d_value, long_array_2d_value, float_array_2d_value, double_array_2d_value, string_array_2d_value]
        value:
          description: Elements in row-major order.
          type: array
          items:
            type: [boolean, integer, number, string]
        rowCount:
          type: integer
        columnCount:
          type: integer
      example:
        '@type': int_array_2d_value
        value: [1, 2, 3, 4, 5, 6]
        rowCount: 2
        columnCount: 3
    Error:
      type: object
      required: [status, code, source, message]
      properties:
        status:
          const: true
        code:
          $ref: '#/components/schemas/ErrorCode'
        source:
          description: '`rade-japc <METHOD> <path>`'
          type: string
        message:
          type: string
      example:
        status: true
        code: 5000
        source: rade-japc GET /api/v1/EXAMPLE.DEVICE/Acquisition
        message: Device not responding
    ErrorCode:
      description: |
        | Code | Meaning | HTTP status | WebSocket close code |
        |---|---|---|---|
        | 5000 | JAPC error | 400, 404, 502, 504 | 4000 |
        | 5001 | Codec error | 400, 500 | 4001 |
        | 5002 | RBAC error | 401, 403 | 4002 |
        | 5003 | Bad request | 400, 404, 406, 415 | 4003 |
        | 5004 | Internal error | 500 | 4004 |
      type: integer
      enum: [5000, 5001, 5002, 5003, 5004]
      x-error-codes:
        '5000': JAPC error
        '5001': Codec error
        '5002': RBAC error
        '5003': Bad request
        '5004': Internal error
    LvTypeDescriptor:
      description: |
        base64url, with padding, of the LabVIEW flattened type descriptor (`Flatten To String` type string, big-endian I16 words).

        | JAPC type | LabVIEW type |
        |---|---|
        | boolean | Boolean |
        | byte | I8 |
        | short | I16 |
        | int | I32 |
        | long | I64 |
        | float | SGL |
        | double | DBL |
        | string | String |
        | 1D / 2D array | 1D / 2D Array |
        | enum | Enum (U8, U16 or U32), items labelled with the JAPC item symbols |
        | enum set | Cluster of Boolean, one per item, labelled with the item symbol. Marked `0x61` |
        | discrete function | 2D Array of DBL, 2 rows (row 0 = X, row 1 = Y) by N columns. Marked `0x60` |
        | discrete function list | 1D Array of 1-element Cluster holding the 2D Array of DBL. The inner array is marked `0x60` |
        | enum / enum set array | 1D / 2D Array of the enum or of the enum set cluster |
        | (no JAPC type) unsigned integers | U8, U16, U32, U64, scalar or array |
        | property | Cluster, labelled with the property name, elements labelled with the field names |

        LabVIEW has no discrete function and no enum set. They are sent as the LabVIEW layout in the table, with the **type code byte** of that
        type descriptor (at any nesting depth) replaced by a code LabVIEW does not use: `0x60` instead of the 2D Array code `0x40`,
        `0x61` instead of the Cluster code `0x50`. A client patches the codes in after flattening the type descriptor it sends,
        and patches them back (`0x60` to `0x40`, `0x61` to `0x50`) before unflattening a type descriptor it receives, as LabVIEW rejects unknown codes.

        Enums use the item symbols, never the JAPC codes.

        | | SET | GET |
        |---|---|---|
        | Enum | Flatten as usual. The service maps the item name to the device's code with the JAPC descriptor of the parameter. | When the service derives the descriptor: U16 Enum listing all items ordered by JAPC code; the value is the position. |
        | Enum set | Marked `0x61`. May list only some of the items: the missing ones are not in the set. | Marked `0x61`, Boolean for every item in JAPC code order. |
        | Unsigned integers | U8 is set as short, U16 as int, U32 as long, U64 as long (error above 2^63-1). | Only when the client's `Lv-Type-Descriptor` declares an unsigned type, the value is then range checked. Otherwise the signed types above. |

        Not representable: `OBJECT` and undefined JAPC values, and the LabVIEW types extended, complex, physical quantity, path, picture, waveform, timestamp, variant and refnum.
      type: string
      format: base64url
      x-labview-types:
        boolean: Boolean
        byte: I8
        short: I16
        int: I32
        long: I64
        float: SGL
        double: DBL
        string: String
        array: 1D Array
        array2d: 2D Array
        map: Cluster
        enum: Enum
        enumSet: Cluster of Boolean, marked 0x61
        discreteFunction: 2D Array of DBL, marked 0x60
        discreteFunctionList: 1D Array of Cluster of 2D Array of DBL, marked 0x60
    LabVIEWData:
      description: |
        LabVIEW flattened data (`Flatten To String`) matching the type descriptor.

        | Element | Encoding |
        |---|---|
        | Byte order | Big-endian |
        | String | I32 length, then bytes |
        | Array | I32 length per dimension, then elements |
        | Cluster | Elements in descriptor order |
        | Enum | Position of the item (U8, U16 or U32 as in the descriptor) |
        | Enum set | One byte per Boolean, in descriptor order |
        | Discrete function | I32 rows (2), I32 columns, then the X row and the Y row as DBL |
      type: string
      format: binary
      x-labview-encoding:
        byteOrder: big-endian
        string: I32 length, then bytes
        array: I32 length per dimension, then elements
        cluster: elements in descriptor order
    LabVIEWError:
      description: |
        Flattened LabVIEW error cluster `error out`: `status` Boolean, `code` I32 (see `ErrorCode`), `source` String.
        `source` is `rade-japc <METHOD> <path><ERR><message>`.
      type: string
      format: binary
      x-labview-cluster:
        label: error out
        elements: [status Boolean, code I32, source String]
    SessionInfo:
      type: object
      description: The caller's own cached RBAC session. Unlike `AdminSession` it has no `handle`, address or timestamps of use; the secret id is never included.
      properties:
        user: {type: string}
        roles: {type: array, items: {type: string}}
        loginType: {$ref: '#/components/schemas/LoginType'}
        location: {type: [string, 'null']}
        tokenExpiry: {type: string, format: date-time, description: When the current application token expires; the service renews it for a cached RBAC session}
        sessionExpiry: {type: string, format: date-time, description: "When the cached RBAC session can no longer be used. Equals `tokenExpiry` for `TOKEN`, which is not renewed"}
    AdminMe:
      type: object
      properties:
        user: {type: string}
        loginType: {$ref: '#/components/schemas/LoginType'}
        roles: {type: array, items: {type: string}}
    AdminServiceInfo:
      type: object
      properties:
        version: {type: string}
        startedAt: {type: string, format: date-time}
        uptime: {type: string, description: ISO-8601 duration}
        rbacEnvironment: {type: string, example: PRO}
        requiredRole: {type: string}
        adminRole: {type: string}
        tokenLifetime: {type: string, description: ISO-8601 duration, example: PT12H}
        sessionLifetime: {type: string, description: ISO-8601 duration, example: PT8760H}
        sessionIdleTimeout: {type: string, description: ISO-8601 duration, example: PT24H}
        sessionsPerUser: {type: integer, description: Most cached RBAC sessions per user; 0 means unlimited}
        sessions: {type: integer, description: Cached RBAC sessions held now}
        subscriptions: {type: integer}
    AdminSession:
      type: object
      description: A cached RBAC session as admins see it. The same entry as the client's `SessionInfo`, plus its public `handle`.
      properties:
        handle: {type: string, description: Public id for revoking the cached RBAC session. Not the secret cached id.}
        user: {type: string}
        loginType: {$ref: '#/components/schemas/LoginType'}
        roles: {type: array, items: {type: string}}
        location: {type: [string, 'null']}
        address: {type: [string, 'null'], description: Address the client logged in from}
        userAgent: {type: [string, 'null'], description: User-Agent of the client that logged in}
        created: {type: string, format: date-time}
        lastUsed: {type: string, format: date-time}
        tokenExpiry: {type: string, format: date-time}
        sessionExpiry: {type: string, format: date-time, description: When the cached RBAC session can no longer be used}
    AdminSubscription:
      type: object
      description: An open WebSocket subscription, opened by the RBAC `user`. Credentials are checked at the handshake only, so revoking the cached RBAC session or the expiry of the token does not close it.
      properties:
        id: {type: string}
        parameter: {type: string}
        selector: {type: string}
        format: {type: string, enum: [json, labview-variant]}
        user: {type: string}
        address: {type: string}
        openedAt: {type: string, format: date-time}
    AdminClientRequests:
      type: object
      properties:
        user: {type: string}
        requests:
          type: object
          description: Keys GET, SET, SUBSCRIBE (absent when zero). Rate-limited requests included.
          additionalProperties: {type: integer}
        rateLimited: {type: integer}
    LoginType:
      type: string
      enum: [EXPLICIT, KERBEROS, OAUTH, TOKEN]
