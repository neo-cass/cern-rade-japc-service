openapi: 3.1.0
info:
  title: RADE JAPC REST API
  version: v1
  description: |
    GET and SET of JAPC device parameters over HTTP.

    | Media type | Format |
    |---|---|
    | `application/json` | japc-json typed value (see `Value`). Default when `Accept` is absent or `*/*`. |
    | `application/labview-variant` | LabVIEW flattened data (see `LabVIEWData`), described by the `Lv-Type-Descriptor` header (see `LvTypeDescriptor`). |

    The response format is selected with `Accept`, the request body format with `Content-Type`.
    Errors use the same format as the request (see `Error`).

    Examples:
    ```
    curl 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition?selector=CPS.USER.ALL'
    curl 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition?fields=current,voltage'
    curl -X PUT -H 'Content-Type: application/json' -d '{"@type":"double_value","value":1.5}' 'https://<host>/api/v1/EXAMPLE.DEVICE/Setting/current'
    curl -H 'Rbac: Explicit <base64url(username:password)>' 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition'
    ```

    Subscriptions: [WebSocket API](/docs/websocket). Specifications: [/openapi.yaml](/openapi.yaml), [/asyncapi.yaml](/asyncapi.yaml).
security:
  - {}
  - Rbac: []
servers:
  - url: /api/v1
    description: This deployment. /api is an alias of /api/v1.
tags:
  - name: Parameter
    description: Access by device, property and optional field in the path.
  - name: LabVIEW descriptor
    description: Access by device in the path. Property and fields are taken from `Lv-Type-Descriptor`.
paths:
  /{device}/{property}:
    parameters:
      - $ref: '#/components/parameters/device'
      - $ref: '#/components/parameters/property'
      - $ref: '#/components/parameters/selector'
    get:
      tags: [Parameter]
      operationId: getProperty
      summary: Get a property
      description: |
        ```
        curl 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition'
        curl -H 'Accept: application/labview-variant' -D - -o value.bin 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition'
        ```
      parameters:
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/LvTypeDescriptorOptional'
      responses:
        '200':
          $ref: '#/components/responses/Value'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags: [Parameter]
      operationId: setProperty
      summary: Set a property
      description: |
        ```
        curl -X PUT -H 'Content-Type: application/json' -d '{"@type":"map_value","current":{"@type":"double_value","value":1.5}}' 'https://<host>/api/v1/EXAMPLE.DEVICE/Setting'
        curl -X PUT -H 'Content-Type: application/labview-variant' -H 'Lv-Type-Descriptor: <descriptor>' --data-binary @value.bin 'https://<host>/api/v1/EXAMPLE.DEVICE/Setting'
        ```
      parameters:
        - $ref: '#/components/parameters/LvTypeDescriptorBody'
      requestBody:
        $ref: '#/components/requestBodies/PropertyValue'
      responses:
        '200':
          $ref: '#/components/responses/Set'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /{device}/{property}/{field}:
    parameters:
      - $ref: '#/components/parameters/device'
      - $ref: '#/components/parameters/property'
      - $ref: '#/components/parameters/field'
      - $ref: '#/components/parameters/selector'
    get:
      tags: [Parameter]
      operationId: getField
      summary: Get a field
      description: |
        ```
        curl 'https://<host>/api/v1/EXAMPLE.DEVICE/Acquisition/current'
        ```
      parameters:
        - $ref: '#/components/parameters/LvTypeDescriptorOptional'
      responses:
        '200':
          $ref: '#/components/responses/Value'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags: [Parameter]
      operationId: setField
      summary: Set a field
      description: |
        ```
        curl -X PUT -H 'Content-Type: application/json' -d '{"@type":"double_value","value":1.5}' 'https://<host>/api/v1/EXAMPLE.DEVICE/Setting/current'
        ```
      parameters:
        - $ref: '#/components/parameters/LvTypeDescriptorBody'
      requestBody:
        $ref: '#/components/requestBodies/FieldValue'
      responses:
        '200':
          $ref: '#/components/responses/Set'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /{device}:
    parameters:
      - $ref: '#/components/parameters/device'
      - $ref: '#/components/parameters/selector'
      - $ref: '#/components/parameters/LvTypeDescriptorDevice'
    get:
      tags: [LabVIEW descriptor]
      operationId: getByDescriptor
      summary: Get the property named by the type descriptor
      description: |
        `404` without `Lv-Type-Descriptor`. `406` if `Accept` does not allow `application/labview-variant`.
        ```
        curl -H 'Accept: application/labview-variant' -H 'Lv-Type-Descriptor: <descriptor>' -o value.bin 'https://<host>/api/v1/EXAMPLE.DEVICE'
        ```
      responses:
        '200':
          description: Value encoded with the supplied descriptor.
          headers:
            Acq-Stamp:
              $ref: '#/components/headers/Acq-Stamp'
            Cycle-Stamp:
              $ref: '#/components/headers/Cycle-Stamp'
            Rbac:
              $ref: '#/components/headers/Rbac'
          content:
            application/labview-variant:
              schema:
                $ref: '#/components/schemas/LabVIEWData'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
    put:
      tags: [LabVIEW descriptor]
      operationId: setByDescriptor
      summary: Set the property named by the type descriptor
      description: |
        `404` without `Lv-Type-Descriptor`. `415` if `Content-Type` is not `application/labview-variant`.
        ```
        curl -X PUT -H 'Content-Type: application/labview-variant' -H 'Lv-Type-Descriptor: <descriptor>' --data-binary @value.bin 'https://<host>/api/v1/EXAMPLE.DEVICE'
        ```
      requestBody:
        required: true
        content:
          application/labview-variant:
            schema:
              $ref: '#/components/schemas/LabVIEWData'
      responses:
        '200':
          $ref: '#/components/responses/Set'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    Rbac:
      type: apiKey
      in: header
      name: Rbac
      description: |
        Optional RBAC credentials. Without the header the request is sent without an RBAC token.

        | Value | Credentials |
        |---|---|
        | `Explicit <base64url(username:password)>` | Login with username and password. |
        | `Location <base64url(token)>` | Serialized RBAC token. |
        | `Cached <id>` | Id returned in the `Rbac` response header of an earlier request. |

        Cached ids are held in memory by the serving instance and are lost on restart.
      x-rbac-schemes: [Explicit, Location, Cached]
  parameters:
    device:
      name: device
      in: path
      required: true
      description: Device name. Must not match `v[0-9]+`.
      schema:
        type: string
        not:
          pattern: '^v[0-9]+$'
      example: EXAMPLE.DEVICE
    property:
      name: property
      in: path
      required: true
      description: Property name.
      schema:
        type: string
      example: Acquisition
    field:
      name: field
      in: path
      required: true
      description: Field name.
      schema:
        type: string
      example: current
    selector:
      name: selector
      in: query
      required: false
      description: JAPC cycle selector, e.g. `CPS.USER.ALL`. Omit for non-multiplexed devices.
      schema:
        type: string
    fields:
      name: fields
      in: query
      required: false
      description: Comma-separated field names, e.g. `current,voltage`. The response contains only these fields. `400` if a field does not exist.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    LvTypeDescriptorOptional:
      name: Lv-Type-Descriptor
      in: header
      required: false
      description: |
        LabVIEW only. Descriptor to encode the response with (see `LvTypeDescriptor`).
        Must describe a cluster labelled with the property name or, for a field path, the field or a cluster labelled with the property containing only that field.
        When absent with `Accept: application/labview-variant`, the server derives the descriptor and returns it in the response.
      schema:
        $ref: '#/components/schemas/LvTypeDescriptor'
    LvTypeDescriptorBody:
      name: Lv-Type-Descriptor
      in: header
      required: false
      description: Required when `Content-Type` is `application/labview-variant`. Describes the request body (see `LvTypeDescriptor`).
      schema:
        $ref: '#/components/schemas/LvTypeDescriptor'
    LvTypeDescriptorDevice:
      name: Lv-Type-Descriptor
      in: header
      required: true
      description: Cluster descriptor (see `LvTypeDescriptor`). The cluster label is the property name and the elements are the fields.
      schema:
        $ref: '#/components/schemas/LvTypeDescriptor'
  headers:
    Acq-Stamp:
      description: Acquisition stamp in nanoseconds since 1970-01-01T00:00:00Z.
      schema:
        type: integer
        format: int64
    Cycle-Stamp:
      description: Cycle stamp in nanoseconds since 1970-01-01T00:00:00Z. `0` when not multiplexed.
      schema:
        type: integer
        format: int64
    Rbac:
      description: '`Cached <id>`. Present when the request had an `Rbac` header. Reuse the value as the `Rbac` request header.'
      schema:
        type: string
        pattern: '^Cached [0-9]+$'
    Lv-Type-Descriptor:
      description: LabVIEW only, when the request had no `Lv-Type-Descriptor`. Descriptor of the response body.
      schema:
        $ref: '#/components/schemas/LvTypeDescriptor'
  requestBodies:
    PropertyValue:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Value'
          example:
            '@type': map_value
            current:
              '@type': double_value
              value: 1.5
        application/labview-variant:
          schema:
            $ref: '#/components/schemas/LabVIEWData'
    FieldValue:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Value'
          example:
            '@type': double_value
            value: 1.5
        application/labview-variant:
          schema:
            $ref: '#/components/schemas/LabVIEWData'
  responses:
    Value:
      description: Parameter value.
      headers:
        Acq-Stamp:
          $ref: '#/components/headers/Acq-Stamp'
        Cycle-Stamp:
          $ref: '#/components/headers/Cycle-Stamp'
        Rbac:
          $ref: '#/components/headers/Rbac'
        Lv-Type-Descriptor:
          $ref: '#/components/headers/Lv-Type-Descriptor'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Value'
          examples:
            property:
              value:
                '@type': map_value
                current:
                  '@type': double_value
                  value: 1.5
                samples:
                  '@type': double_array_value
                  value: [1.0, 2.0]
            field:
              value:
                '@type': double_value
                value: 1.5
        application/labview-variant:
          schema:
            $ref: '#/components/schemas/LabVIEWData'
    Set:
      description: Value set. No body.
      headers:
        Rbac:
          $ref: '#/components/headers/Rbac'
    Error:
      description: |
        Error in the negotiated format (see `Error`, `LabVIEWError`).

        | HTTP status | Cause |
        |---|---|
        | 400 | Invalid request, value, selector or type descriptor |
        | 401 | Invalid or expired RBAC credentials |
        | 403 | RBAC access denied |
        | 404 | Unknown route, device or property |
        | 406 | Requested media type not available |
        | 415 | Request media type not supported |
        | 500 | Internal error |
        | 502 | Device or middleware error |
        | 504 | Device timeout |
      headers:
        Lv-Type-Descriptor:
          description: LabVIEW only. Descriptor of the error cluster.
          schema:
            $ref: '#/components/schemas/LvTypeDescriptor'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/labview-variant:
          schema:
            $ref: '#/components/schemas/LabVIEWError'
      x-http-status:
        '400': Invalid request, value, selector or type descriptor
        '401': Invalid or expired RBAC credentials
        '403': RBAC access denied
        '404': Unknown route, device or property
        '406': Requested media type not available
        '415': Request media type not supported
        '500': Internal error
        '502': Device or middleware error
        '504': Device timeout
  schemas:
    Value:
      description: |
        japc-json typed value. `@type` identifies the JAPC value type.
        Enum, enum set and discrete function values use the japc-json 8.2.1 encoding and are not supported by `application/labview-variant`.
      oneOf:
        - $ref: '#/components/schemas/MapValue'
        - $ref: '#/components/schemas/ScalarValue'
        - $ref: '#/components/schemas/ArrayValue'
        - $ref: '#/components/schemas/Array2DValue'
    SimpleValue:
      oneOf:
        - $ref: '#/components/schemas/ScalarValue'
        - $ref: '#/components/schemas/ArrayValue'
        - $ref: '#/components/schemas/Array2DValue'
    MapValue:
      description: Property value. Each member other than `@type` is a field.
      type: object
      required: ['@type']
      properties:
        '@type':
          const: map_value
      additionalProperties:
        $ref: '#/components/schemas/SimpleValue'
      example:
        '@type': map_value
        current:
          '@type': double_value
          value: 1.5
    ScalarValue:
      type: object
      required: ['@type', value]
      properties:
        '@type':
          enum: [boolean_value, byte_value, short_value, int_value, long_value, float_value, double_value, string_value]
        value:
          type: [boolean, integer, number, string]
      example:
        '@type': double_value
        value: 1.5
    ArrayValue:
      type: object
      required: ['@type', value]
      properties:
        '@type':
          enum: [boolean_array_value, byte_array_value, short_array_value, int_array_value, long_array_value, float_array_value, double_array_value, string_array_value]
        value:
          type: array
          items:
            type: [boolean, integer, number, string]
      example:
        '@type': double_array_value
        value: [1.0, 2.0]
    Array2DValue:
      type: object
      required: ['@type', value, rowCount, columnCount]
      properties:
        '@type':
          enum: [boolean_array_2d_value, byte_array_2d_value, short_array_2d_value, int_array_2d_value, long_array_2d_value, float_array_2d_value, double_array_2d_value, string_array_2d_value]
        value:
          description: Elements in row-major order.
          type: array
          items:
            type: [boolean, integer, number, string]
        rowCount:
          type: integer
        columnCount:
          type: integer
      example:
        '@type': int_array_2d_value
        value: [1, 2, 3, 4, 5, 6]
        rowCount: 2
        columnCount: 3
    Error:
      type: object
      required: [status, code, source, message]
      properties:
        status:
          const: true
        code:
          $ref: '#/components/schemas/ErrorCode'
        source:
          description: '`rade-japc <METHOD> <path>`'
          type: string
        message:
          type: string
      example:
        status: true
        code: 5000
        source: rade-japc GET /api/v1/EXAMPLE.DEVICE/Acquisition
        message: Device not responding
    ErrorCode:
      description: |
        | Code | Meaning |
        |---|---|
        | 5000 | JAPC error |
        | 5001 | Codec error |
        | 5002 | RBAC error |
        | 5003 | Bad request |
        | 5004 | Internal error |
      type: integer
      enum: [5000, 5001, 5002, 5003, 5004]
      x-error-codes:
        '5000': JAPC error
        '5001': Codec error
        '5002': RBAC error
        '5003': Bad request
        '5004': Internal error
    LvTypeDescriptor:
      description: |
        base64url, with padding, of the LabVIEW flattened type descriptor (`Flatten To String` type string, big-endian I16 words).

        | JAPC type | LabVIEW type |
        |---|---|
        | boolean | Boolean |
        | byte | I8 |
        | short | I16 |
        | int | I32 |
        | long | I64 |
        | float | SGL |
        | double | DBL |
        | string | String |
        | 1D / 2D array | 1D / 2D Array |
        | property | Cluster, labelled with the property name, elements labelled with the field names |
      type: string
      format: base64url
      x-labview-types:
        boolean: Boolean
        byte: I8
        short: I16
        int: I32
        long: I64
        float: SGL
        double: DBL
        string: String
        array: 1D Array
        array2d: 2D Array
        map: Cluster
    LabVIEWData:
      description: |
        LabVIEW flattened data (`Flatten To String`) matching the type descriptor.

        | Element | Encoding |
        |---|---|
        | Byte order | Big-endian |
        | String | I32 length, then bytes |
        | Array | I32 length per dimension, then elements |
        | Cluster | Elements in descriptor order |
      type: string
      format: binary
      x-labview-encoding:
        byteOrder: big-endian
        string: I32 length, then bytes
        array: I32 length per dimension, then elements
        cluster: elements in descriptor order
    LabVIEWError:
      description: |
        Flattened LabVIEW error cluster `error out`: `status` Boolean, `code` I32 (see `ErrorCode`), `source` String.
        `source` is `rade-japc <METHOD> <path><ERR><message>`.
      type: string
      format: binary
      x-labview-cluster:
        label: error out
        elements: [status Boolean, code I32, source String]
