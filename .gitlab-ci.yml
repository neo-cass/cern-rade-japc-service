buildImage:
  image:
    name: gitlab-registry.cern.ch/ci-tools/docker-image-builder:latest
    entrypoint: [""]
  stage: build
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

buildWar:
  image:
    name: gradle:alpine
  before_script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
  stage: build
  script: gradle -Pversion=$CI_COMMIT_REF_SLUG bootWar
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    policy: push
    paths:
      - japc-1.0.0.war
