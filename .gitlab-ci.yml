variables:
  WAR_NAME: "japc-$CI_COMMIT_REF_SLUG.war"
  REDOCLY_CLI: "@redocly/cli@2.72.1"
  ASYNCAPI_CLI: "@asyncapi/cli@6.2.2"
  ASYNCAPI_HTML_TEMPLATE: "@asyncapi/html-template@3.5.6"
  # TODO pin: floating tag, replace by a concrete version once known (no registry access when this was written)
  CMW_TOOLS_IMAGE: "gitlab-registry.cern.ch/rade/rade-core/continuous-integration/cmw-tools:latest"
  PROD_APP_NAME: "japc"   # production deployment; https://rade-services-japc.web.cern.ch always serves it (deploy/route.yaml)

# Pipelines (deploy section at the bottom):
#   feature branch: review app (deploy_review -> test_deployed), stopped after a week or with stop_review
#   default branch: staging    (deploy_staging -> test_deployed), the stable pre-production environment
#   tag (release):  release_guard, the same build/test jobs, then a manual deploy_production (deployment japc) that
#                   also points the production URL at it, followed by a read-only smoke_production
#   every pipeline: publish_war (after test_war) publishes the Spring Boot war as cern.rade.services:japc to the
#                   Maven repositories of CBNG, like the common and codec libraries: Pro on a tag, Development
#                   (<branch>-SNAPSHOT) on a branch. Automatic, independent of the manual deploy_production.
stages:
  - .pre
  - buildDocs
  - buildWar
  - testWar
  - buildImage
  - deploy
  - testDeployed
  - smokeProduction
  # last, but publish_war starts right after test_war (needs): the last stage only keeps a failed publication from blocking the deploy jobs
  - publish

release_guard:
  stage: .pre
  tags:
    - k8s-default
  image:
    name: registry.cern.ch/docker.io/library/alpine:3.21
  script:
    # a release must be reproducible: no moving SNAPSHOT dependency (commented-out lines are ignored)
    - |
      found=0
      for f in build.gradle.kts settings.gradle.kts gradle.properties; do
        if [ -f "$f" ] && grep -v '^[[:space:]]*//' "$f" | grep -n 'SNAPSHOT'; then
          echo "ERROR: $f references a -SNAPSHOT version, release tag $CI_COMMIT_TAG cannot be deployed"
          found=1
        fi
      done
      exit $found
  rules:
    - if: $CI_COMMIT_TAG

build_docs:
  tags:
    - k8s-default
  image:
    name: registry.cern.ch/docker.io/library/node:22-alpine
  stage: buildDocs
  variables:
    REDOCLY_TELEMETRY: "off"
  artifacts:
    paths:
      - build/api-docs
  script:
    - npx --yes $ASYNCAPI_CLI config analytics --disable
    - npx --yes $REDOCLY_CLI lint docs/openapi.yml
    - npx --yes $ASYNCAPI_CLI validate docs/asyncapi.yml
    - npx --yes $ASYNCAPI_CLI generate fromTemplate docs/asyncapi.yml $ASYNCAPI_HTML_TEMPLATE -o build/api-docs/websocket -p singleFile=true -p outFilename=index.html --force-write --no-interactive
    - cp docs/index.html build/api-docs/index.html
    - cp docs/openapi.yml build/api-docs/openapi.yaml
    - cp docs/asyncapi.yml build/api-docs/asyncapi.yaml

.gradle_job:
  tags:
    - k8s-default
  image:
    name: registry.cern.ch/docker.io/library/eclipse-temurin:21-alpine
  before_script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    - chmod +x ./gradlew
    - apk update && apk add wget
    - wget -O root.crt "https://ca.cern.ch/cafiles/certificates/CERN%20Certification%20Authority.crt"
    - wget -O auth.crt "https://ca.cern.ch/cafiles/certificates/CERN%20Certification%20Authority(1).crt"
    - keytool -cacerts -keypass changeit -alias root.crt -storepass changeit -noprompt -importcert -file root.crt
    - keytool -cacerts -keypass changeit -alias auth.crt -storepass changeit -noprompt -importcert -file auth.crt

build_war:
  extends: .gradle_job
  artifacts:
    name: "$WAR_NAME"
    paths:
      - "./build/libs/$WAR_NAME"
  stage: buildWar
  script:
    - ./gradlew -PwarName=$WAR_NAME bootWar

.endpoint_tests:
  extends: .gradle_job
  artifacts:
    when: always
    paths:
      - build/reports/tests
    reports:
      junit: build/test-results/test/*.xml

test_war:
  extends: .endpoint_tests
  stage: testWar
  needs: [build_war]
  services:
    - name: gitlab-registry.cern.ch/acc-co/cmw/cmw-core/cmw-directory-private
      alias: cmw-directory-private
      command: ['--cmw.directory.server.devices.seed={"RADE.TEST": "RadeTestServer", "RADE.TEST.RBAC": "RadeTestRbacServer"}']
    - name: $CMW_TOOLS_IMAGE
      alias: rda3-data-server
      entrypoint: ["bash", "-c"]
      command: ["until (echo > /dev/tcp/cmw-directory-private/7021) 2>/dev/null; do sleep 1; done; Rda3DataServer -server rda3 -log /tmp & Rda3DataServer -server RadeTestServer -log /tmp & exec Rda3DataServer -server RadeTestRbacServer -rbac -log /tmp"]
  variables:
    CMW_DIRECTORY_ENV: PRIVATE
    APP_URL: http://localhost:8443/api/v1
    SUB_URL: ws://localhost:8443/ws/v1
  script:
    - java -Dcmw.directory.env=PRIVATE -jar build/libs/$WAR_NAME > japc.log 2>&1 &
    - timeout 180 sh -c 'until wget -q -O /dev/null http://localhost:8081/actuator/health/readiness; do sleep 2; done'
    - ./gradlew test
  after_script:
    - tail -n 200 japc.log

test_deployed:
  extends: .endpoint_tests
  stage: testDeployed
  needs:
    - job: deploy_review
      optional: true
    - job: deploy_staging
      optional: true
  script:
    - ./gradlew test
  rules:
    - if: $CI_COMMIT_BRANCH

# Same publishing as the common and codec libraries: Pro for a tag, Development (<branch>-SNAPSHOT) for a branch. The
# artifact is the executable war of bootWar (build.gradle.kts, publication "cbng"), named japc-<version>.war in the
# repository whatever WAR_NAME is. CBNG authenticates with the job token of the pipeline, nothing is configured here.
# build_docs artifacts are needed: the api docs are packaged in the war. publish runs the same unit tests as build does.
publish_war:
  extends: .gradle_job
  stage: publish
  needs:
    - job: release_guard
      optional: true
      artifacts: false
    - job: build_docs
    - job: test_war
      artifacts: false
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]
      then
        ./gradlew -Pversion=$CI_COMMIT_TAG bootWar publishAllPublicationsToProRepository
      else
        ./gradlew -Pversion="${CI_COMMIT_REF_SLUG}-SNAPSHOT" bootWar publishAllPublicationsToDevelopmentRepository
      fi
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH

build_image:
  tags:
    - k8s-default
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  stage: buildImage
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - DESTINATIONS="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # release tags also get an exact, never reused tag: this is what production runs and what a rollback redeploys
    - if [ -n "$CI_COMMIT_TAG" ]; then DESTINATIONS="$DESTINATIONS --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"; fi
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile $DESTINATIONS --build-arg WAR_NAME=$WAR_NAME

.paas:
  tags:
    - k8s-default
  stage: deploy
  # TODO pin: floating tag, replace by a concrete version once known (no registry access when this was written)
  image: gitlab-registry.cern.ch/paas-tools/openshift-client:latest
  variables:
    SERVER: https://api.paas.okd.cern.ch
    PROJECT: rade-services   # name of your Openshift project
  before_script:
    - oc login $SERVER --token=$PAAS_SERVICE_TOKEN
    - oc project $PROJECT
    - export APP_NAME=${APP_NAME:-$(echo "japc-$CI_COMMIT_REF_SLUG" | cut -c1-49 | sed 's/-*$//')}

# Review apps and staging: image of the pipeline's commit, own Route with a generated host
.deploy:
  extends: .paas
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  script:
    - sed -e "s|\${APP_NAME}|$APP_NAME|g" -e "s|\${IMAGE}|$CI_REGISTRY_IMAGE:$IMAGE_TAG|g" deploy/app.yaml | oc apply -f -
    - sed -e "s|\${APP_NAME}|$APP_NAME|g" deploy/app-route.yaml | oc apply -f -
    - oc rollout status deployment/$APP_NAME --timeout=5m
    - HOST=$(oc get route $APP_NAME -o jsonpath='{.spec.host}')
    - echo "ENV_URL=https://$HOST" > deploy.env
    - echo "APP_URL=https://$HOST/api/v1" >> deploy.env
    - echo "SUB_URL=wss://$HOST/ws/v1" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  environment:
    url: $ENV_URL

# Default branch: staging. The deployment keeps its name japc-master so the existing deployment is updated in place.
deploy_staging:
  extends: .deploy
  environment:
    name: staging
    deployment_tier: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_review:
  extends: .deploy
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    on_stop: stop_review
    auto_stop_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

stop_review:
  extends: .paas
  variables:
    GIT_STRATEGY: none
  script:
    - oc delete deployment,service,route -l app=$APP_NAME --ignore-not-found
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual

# Release tags: manual, and only after the guard, docs, tests and image build of the same tag pipeline passed.
# Re-running this job from the pipeline of an older tag is the rollback: that tag's image and manifests are applied.
deploy_production:
  extends: .paas
  variables:
    APP_NAME: $PROD_APP_NAME
    IMAGE_TAG: $CI_COMMIT_TAG
  needs:
    - job: release_guard
      artifacts: false
    - job: build_docs
      artifacts: false
    - job: test_war
      artifacts: false
    - job: build_image
      artifacts: false
  resource_group: production
  script:
    - sed -e "s|\${APP_NAME}|$APP_NAME|g" -e "s|\${IMAGE}|$CI_REGISTRY_IMAGE:$IMAGE_TAG|g" deploy/app.yaml | oc apply -f -
    # no generated-host Route (deploy/app-route.yaml) for production; remove the one an earlier version of this job created
    - oc delete route/$APP_NAME --ignore-not-found
    - oc rollout status deployment/$APP_NAME --timeout=5m
    # only once the rollout is healthy, point the production URL at this deployment
    - sed -e "s|\${ROUTE_TARGET}|$APP_NAME|g" deploy/route.yaml | oc apply -f -
  environment:
    name: production
    deployment_tier: production
    url: https://rade-services-japc.web.cern.ch
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

# Read-only: no device GET/SET. EndpointTest (test_deployed) writes to RADE.TEST and must never run against production.
# /readyz and /openapi.yaml are public paths served on the route port (8443), unlike /actuator/** on 8081.
smoke_production:
  extends: .paas
  stage: smokeProduction
  variables:
    APP_NAME: $PROD_APP_NAME
    GIT_STRATEGY: none
  needs:
    - job: deploy_production
      artifacts: false
  script:
    - oc rollout status deployment/$APP_NAME --timeout=5m
    - test "$(oc get route japc-prod -o jsonpath='{.spec.to.name}')" = "$APP_NAME"
    - test "$(oc get deployment/$APP_NAME -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - HOST=$(oc get route japc-prod -o jsonpath='{.spec.host}')
    - curl -fsS --retry 12 --retry-delay 5 --retry-all-errors https://$HOST/readyz | tee /dev/stderr | grep -q '"status":"UP"'
    - curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -o /dev/null https://$HOST/openapi.yaml
  rules:
    - if: $CI_COMMIT_TAG
