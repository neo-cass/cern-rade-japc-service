variables:
  WAR_NAME: "japc-$CI_COMMIT_REF_SLUG.war"
  REDOCLY_CLI: "@redocly/cli@2.72.1"
  ASYNCAPI_CLI: "@asyncapi/cli@6.2.2"
  ASYNCAPI_HTML_TEMPLATE: "@asyncapi/html-template@3.5.6"
  CMW_TOOLS_IMAGE: "gitlab-registry.cern.ch/rade/rade-core/continuous-integration/cmw-tools:latest"
  ROUTE_BRANCH: "refactor"   # branch whose deployment https://rade-services-japc.web.cern.ch serves

stages:
  - buildDocs
  - buildWar
  - testWar
  - buildImage
  - deploy
  - testDeployed

build_docs:
  tags:
    - k8s-default
  image:
    name: registry.cern.ch/docker.io/library/node:22-alpine
  stage: buildDocs
  variables:
    REDOCLY_TELEMETRY: "off"
  artifacts:
    paths:
      - build/api-docs
  script:
    - npx --yes $ASYNCAPI_CLI config analytics --disable
    - npx --yes $REDOCLY_CLI lint docs/openapi.yml
    - npx --yes $ASYNCAPI_CLI validate docs/asyncapi.yml
    - npx --yes $ASYNCAPI_CLI generate fromTemplate docs/asyncapi.yml $ASYNCAPI_HTML_TEMPLATE -o build/api-docs/websocket -p singleFile=true -p outFilename=index.html --force-write --no-interactive
    - cp docs/index.html build/api-docs/index.html
    - cp docs/openapi.yml build/api-docs/openapi.yaml
    - cp docs/asyncapi.yml build/api-docs/asyncapi.yaml

.gradle_job:
  tags:
    - k8s-default
  image:
    name: registry.cern.ch/docker.io/library/eclipse-temurin:21-alpine
  before_script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    - chmod +x ./gradlew
    - apk update && apk add wget
    - wget -O root.crt "https://ca.cern.ch/cafiles/certificates/CERN%20Certification%20Authority.crt"
    - wget -O auth.crt "https://ca.cern.ch/cafiles/certificates/CERN%20Certification%20Authority(1).crt"
    - keytool -cacerts -keypass changeit -alias root.crt -storepass changeit -noprompt -importcert -file root.crt
    - keytool -cacerts -keypass changeit -alias auth.crt -storepass changeit -noprompt -importcert -file auth.crt

build_war:
  extends: .gradle_job
  artifacts:
    name: "$WAR_NAME"
    paths:
      - "./build/libs/$WAR_NAME"
  stage: buildWar
  script:
    - ./gradlew -PwarName=$WAR_NAME bootWar

.endpoint_tests:
  extends: .gradle_job
  artifacts:
    when: always
    paths:
      - build/reports/tests
    reports:
      junit: build/test-results/test/*.xml

test_war:
  extends: .endpoint_tests
  stage: testWar
  needs: [build_war]
  services:
    - name: gitlab-registry.cern.ch/acc-co/cmw/cmw-core/cmw-directory-private
      alias: cmw-directory-private
      command: ['--cmw.directory.server.devices.seed={"RADE.TEST": "RadeTestServer", "RADE.TEST.RBAC": "RadeTestRbacServer"}']
    - name: $CMW_TOOLS_IMAGE
      alias: rda3-data-server
      entrypoint: ["bash", "-c"]
      command: ["until (echo > /dev/tcp/cmw-directory-private/7021) 2>/dev/null; do sleep 1; done; Rda3DataServer -server rda3 -log /tmp & Rda3DataServer -server RadeTestServer -log /tmp & exec Rda3DataServer -server RadeTestRbacServer -rbac -log /tmp"]
  variables:
    CMW_DIRECTORY_ENV: PRIVATE
    APP_URL: http://localhost:8443/api/v1
    SUB_URL: ws://localhost:8443/ws/v1
  script:
    - java -Dcmw.directory.env=PRIVATE -jar build/libs/$WAR_NAME > japc.log 2>&1 &
    - timeout 180 sh -c 'until wget -q -O /dev/null http://localhost:8081/actuator/health/readiness; do sleep 2; done'
    - ./gradlew test
  after_script:
    - tail -n 200 japc.log

test_deployed:
  extends: .endpoint_tests
  stage: testDeployed
  needs:
    - job: deploy_review
      optional: true
    - job: deploy_master
      optional: true
  script:
    - ./gradlew test
  rules:
    - if: $CI_COMMIT_BRANCH

build_image:
  tags:
    - k8s-default
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  stage: buildImage
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --build-arg WAR_NAME=$WAR_NAME

.paas:
  tags:
    - k8s-default
  stage: deploy
  image: gitlab-registry.cern.ch/paas-tools/openshift-client:latest
  variables:
    SERVER: https://api.paas.okd.cern.ch
    PROJECT: rade-services   # name of your Openshift project
  before_script:
    - oc login $SERVER --token=$PAAS_SERVICE_TOKEN
    - oc project $PROJECT
    - export APP_NAME=${APP_NAME:-$(echo "japc-$CI_COMMIT_REF_SLUG" | cut -c1-49 | sed 's/-*$//')}

.deploy:
  extends: .paas
  script:
    - sed -e "s|\${APP_NAME}|$APP_NAME|g" -e "s|\${IMAGE}|$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA|g" deploy/app.yaml | oc apply -f -
    - oc rollout status deployment/$APP_NAME --timeout=5m
    - HOST=$(oc get route $APP_NAME -o jsonpath='{.spec.host}')
    - echo "APP_URL=https://$HOST/api/v1" > deploy.env
    - echo "SUB_URL=wss://$HOST/ws/v1" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  environment:
    url: $APP_URL

deploy_master:
  extends: .deploy
  environment:
    name: master
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish_route:
  extends: .paas
  needs:
    - job: deploy_review
      optional: true
    - job: deploy_master
      optional: true
  script:
    - sed -e "s|\${ROUTE_TARGET}|$APP_NAME|g" deploy/route.yaml | oc apply -f -
  rules:
    - if: $CI_COMMIT_BRANCH == $ROUTE_BRANCH

deploy_review:
  extends: .deploy
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    on_stop: stop_review
    auto_stop_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

stop_review:
  extends: .paas
  variables:
    GIT_STRATEGY: none
  script:
    - oc delete deployment,service,route -l app=$APP_NAME --ignore-not-found
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual

deploy_production:
  extends: .deploy
  variables:
    APP_NAME: japc
  environment:
    name: production
    deployment_tier: production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
