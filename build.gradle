plugins {
    id 'java'
    id 'war'
    id ("cern.devops.cbng.dependency") version "4.0.52"
}
repositories {
    mavenCentral()
    // our package index to resolve dependencies
    maven {
        url "https://artifactory.cern.ch/release"
    }
}

dependencies {
    implementation ("cern.japc:japc:PRO")
    implementation ("cern.japc:japc-ext-cmwrda3:PRO")
    implementation ("cern.japc:japc-value:PRO")
    implementation ("cern.japc:japc-ext-remote:PRO")
    implementation ("cern.accsoft.security:rbac-client:PRO")
    implementation ("cern.accsoft.security:rbac-common:PRO")
    implementation ("cern.accsoft.security:rbac-util:PRO")
    implementation ("cern.cmw:cmw-data:PRO")
    implementation ("org.apache.commons:commons-lang3:3.12.0")
    implementation ("jakarta.servlet:jakarta.servlet-api:5.0.0-M1")
    implementation ("jakarta.websocket:jakarta.websocket-api:2.0.0-M1")
    implementation ("jakarta.ws.rs:jakarta.ws.rs-api:3.1.0")
    implementation ("com.google.code.gson:gson:2.10.1")
    implementation ("cern.rade.services:codec:1.0.3")
    implementation ("cern.rade.services:common:1.0.3")
}

war{
    //getWebAppDirectory().set(file('src/main/webapp'))
    from file('$buildDir/libs/$war')
    getDestinationDirectory().set(file('webapp-build'))
}

// requirement for building this project
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

