plugins {
    id 'java'
    id 'war'
    id ('cern.devops.cbng.dependency') version "4.0.52"
}
repositories {
    mavenCentral()
    // our package index to resolve dependencies
    maven {
        url 'https://artifactory.cern.ch/release'
    }
}

dependencies {
    implementation ("cern.japc:japc:PRO")
    implementation ("cern.japc:japc-ext-cmwrda3:PRO")
    implementation ("cern.japc:japc-value:PRO")
    implementation ("cern.japc:japc-ext-remote:PRO")
    implementation ("cern.cmw:cmw-data:PRO")
    implementation('org.apache.commons:commons-lang3:3.12.0')
    implementation('jakarta.servlet:jakarta.servlet-api:5.0.0')
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'
    implementation(group: 'cern.rade.services', name: 'codec', version: '1.0.0')
    implementation(group: 'cern.rade.services', name: 'common', version: '1.0.0')
}

war{
    webAppDirectory = file('src/main/webapp')

    from file('$buildDir/libs/$war')
    destinationDir = file('webapp-build')
}

// requirement for building this project
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

