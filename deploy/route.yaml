apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: japc-prod
  labels:
    app: japc-prod
  annotations:
    router.cern.ch/network-visibility: Intranet
spec:
  host: rade-services-japc.web.cern.ch
  to:
    kind: Service
    name: ${ROUTE_TARGET}
  port:
    targetPort: 8443
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
