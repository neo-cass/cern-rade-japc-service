apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: japc-prod
  labels:
    app: japc-prod
  annotations:
    router.cern.ch/network-visibility: Intranet
    # Per-IP backstop, above the per-user limits in the service (50 requests/s, 200 subscriptions) so those answer first
    # with 429/5005. rate-http counts HTTP requests per 3 s; concurrent-tcp includes one connection per subscription.
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "600"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "1000"
spec:
  host: rade-services-japc.web.cern.ch
  to:
    kind: Service
    name: ${ROUTE_TARGET}
  port:
    targetPort: 8443
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
