apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      imagePullSecrets:
        - name: gitlab-pull-secret
      containers:
        - name: japc
          image: ${IMAGE}
          ports:
            - containerPort: 8443
            - containerPort: 8081
              name: management
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod,sso,monit"
            - name: OTEL_SERVICE_NAME
              value: ${APP_NAME}
            # optional: without the secret the pod starts and MONIT export stays off
            - name: MONIT_ENABLED
              valueFrom:
                secretKeyRef:
                  name: monit-tenant
                  key: MONIT_ENABLED
                  optional: true
            - name: MONIT_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: monit-tenant
                  key: MONIT_CREDENTIALS
                  optional: true
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: rade-services-japc-admin-sso
                  key: SSO_CLIENT_ID
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rade-services-japc-admin-sso
                  key: SSO_CLIENT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
spec:
  selector:
    app: ${APP_NAME}
  ports:
    - port: 8443
      targetPort: 8443
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
  annotations:
    router.cern.ch/network-visibility: Intranet
    # Per-IP backstop, above the per-user limits in the service (50 requests/s, 200 subscriptions) so those answer first
    # with 429/5005. rate-http counts HTTP requests per 3 s; concurrent-tcp includes one connection per subscription.
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "600"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "1000"
spec:
  to:
    kind: Service
    name: ${APP_NAME}
  port:
    targetPort: 8443
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
